name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed (attempt $attempt/3); retrying in 15 seconds..."
              sleep 15
            fi
          done
          exit 1

      - name: Download FFmpeg
        run: node build-scripts/download-ffmpeg.js

      - name: Build yutto on Unix
        if: runner.os != 'Windows'
        working-directory: build-scripts
        run: bash ./build-yutto.sh

      - name: Build yutto on Windows
        if: runner.os == 'Windows'
        working-directory: build-scripts
        shell: pwsh
        run: ./build-yutto.ps1

      - name: Build application and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Another Yutto GUI v__VERSION__
          releaseBody: |
            See the assets below to download the installer for your platform.

            The macOS build uses free ad-hoc signing. If macOS blocks the first launch,
            right-click the app and choose Open, or run:

            `xattr -dr com.apple.quarantine "/Applications/Another Yutto GUI.app"`
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
