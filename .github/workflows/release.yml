name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            bundles: dmg
          - name: Linux
            platform: ubuntu-22.04
            bundles: deb,appimage
          - name: Windows
            platform: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg
        run: node build-scripts/download-ffmpeg.js

      - name: Build yutto on Unix
        if: runner.os != 'Windows'
        working-directory: build-scripts
        run: bash ./build-yutto.sh

      - name: Build yutto on Windows
        if: runner.os == 'Windows'
        working-directory: build-scripts
        shell: pwsh
        run: ./build-yutto.ps1

      - name: Build application and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Another Yutto GUI v__VERSION__
          releaseBody: |
            See the assets below to download the installer for your platform.
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
